name: Deploy PC LAB v2.3.13 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch current verified v2.3.12 Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "https://doguri25.github.io/pc-lab/?pc_lab_base=v2312-${GITHUB_SHA}" -o /tmp/pc-lab.html
          grep -q 'PC LAB v2.3.12' /tmp/pc-lab.html
          grep -q '2.3.12-8f23588a26e1' /tmp/pc-lab.html
          grep -q '만든이: 도구리' /tmp/pc-lab.html
          grep -q 'RAM 슬롯 구역' /tmp/pc-lab.html
          grep -q 'ui.termOpen&&ui.termReturn' /tmp/pc-lab.html
          grep -q 'preserveBoot' /tmp/pc-lab.html

      - name: Apply v2.3.13 mobile input and history patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch-pages-v2313.py /tmp/pc-lab.html
          grep -q 'PC LAB v2.3.13' /tmp/pc-lab.html
          grep -q '2.3.13-1d813b29baec' /tmp/pc-lab.html
          grep -q 'pc-lab-v2313-mobile-input-fix' /tmp/pc-lab.html
          grep -q "APP_HISTORY_KEY='pc-lab-route'" /tmp/pc-lab.html
          grep -q "window.addEventListener('popstate'" /tmp/pc-lab.html
          grep -q '만든이: 도구리' /tmp/pc-lab.html
          grep -q 'RAM 슬롯 구역' /tmp/pc-lab.html
          grep -q 'preserveBoot' /tmp/pc-lab.html
          rm -rf _site
          mkdir -p _site
          cp /tmp/pc-lab.html _site/index.html
          printf 'PC LAB v2.3.13\nBuild 2.3.13-1d813b29baec\n만든이: 도구리\n' > _site/version.txt
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
