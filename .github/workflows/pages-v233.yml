name: Deploy PC LAB v2.3.5 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch current verified final v2.3.4 Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "https://doguri25.github.io/pc-lab/?pc_lab_base=v234-final-${GITHUB_SHA}" -o /tmp/pc-lab.html
          grep -q 'PC LAB v2.3.4' /tmp/pc-lab.html
          grep -q '2.3.4-4490bd72e3c7' /tmp/pc-lab.html
          grep -q '나사 제거됨 · 빈 나사 구멍' /tmp/pc-lab.html
          grep -q 'pc-lab-v234-focus-fix' /tmp/pc-lab.html

      - name: Apply v2.3.5 header inset patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch-pages-v235.py /tmp/pc-lab.html
          grep -q 'PC LAB v2.3.5' /tmp/pc-lab.html
          grep -q '2.3.5-652ba33c4b49' /tmp/pc-lab.html
          grep -q 'pc-lab-v235-focus-inset-fix' /tmp/pc-lab.html
          grep -q 'padding:5px 8px 10px' /tmp/pc-lab.html
          grep -q '나사 제거됨 · 빈 나사 구멍' /tmp/pc-lab.html
          rm -rf _site
          mkdir -p _site
          cp /tmp/pc-lab.html _site/index.html
          printf 'PC LAB v2.3.5\nBuild 2.3.5-652ba33c4b49\n' > _site/version.txt
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
