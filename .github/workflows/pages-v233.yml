name: Deploy PC LAB v2.3.9 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch current verified v2.3.6 Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "https://doguri25.github.io/pc-lab/?pc_lab_base=v236-live-${GITHUB_SHA}" -o /tmp/pc-lab.html
          echo 'db74ced16af8eb5942126171f9632244b9190bdbe799d91e21ae9c4d541874bc  /tmp/pc-lab.html' | sha256sum -c -
          grep -q 'PC LAB v2.3.6' /tmp/pc-lab.html
          grep -q '2.3.6-d024960916af' /tmp/pc-lab.html
          grep -q 'function refreshSystemModal(body)' /tmp/pc-lab.html

      - name: Apply exact v2.3.9 bundle patch
        shell: bash
        run: |
          set -euo pipefail
          cat pages-patches/v239-part-00.b64 pages-patches/v239-part-01.b64 pages-patches/v239-part-02.b64 pages-patches/v239-part-03.b64 pages-patches/v239-part-04.b64 pages-patches/v239-part-05.b64 pages-patches/v239-part-06.b64 > /tmp/v239-patch.b64
          echo '60cd66a694920b35256da0de94bbfa823d46bfbf0d113763489ae6eb06dbd45c  /tmp/v239-patch.b64' | sha256sum -c -
          base64 --decode /tmp/v239-patch.b64 > /tmp/v239.patch.xz
          xz --test /tmp/v239.patch.xz
          xz --decompress --stdout /tmp/v239.patch.xz > /tmp/v239.patch
          patch --silent /tmp/pc-lab.html < /tmp/v239.patch
          echo '693b1b82cfaa967326bebb9dccf74335df246e5d557a995fe4cc4f4323dad142  /tmp/pc-lab.html' | sha256sum -c -
          grep -q 'PC LAB v2.3.9' /tmp/pc-lab.html
          grep -q '2.3.9-69cb4cc7a858' /tmp/pc-lab.html
          grep -q 'RAM 슬롯 구역' /tmp/pc-lab.html
          grep -q 'ui.termOpen&&ui.termReturn' /tmp/pc-lab.html
          grep -q 'function refreshSystemModal(body)' /tmp/pc-lab.html
          grep -q 'preserveBoot' /tmp/pc-lab.html
          grep -q '나사 제거됨 · 빈 나사 구멍' /tmp/pc-lab.html
          rm -rf _site
          mkdir -p _site
          cp /tmp/pc-lab.html _site/index.html
          printf 'PC LAB v2.3.9\nBuild 2.3.9-69cb4cc7a858\n' > _site/version.txt
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
