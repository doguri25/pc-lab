name: Deploy PC LAB v2.3.16 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch current v2.3.15 Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "https://doguri25.github.io/pc-lab/?pc_lab_base=v2315-hotfix-${GITHUB_SHA}" -o /tmp/pc-lab.html
          grep -q 'PC LAB v2.3.15' /tmp/pc-lab.html
          grep -q '2.3.15-1ed8f3203523' /tmp/pc-lab.html
          grep -q 'PC LAB 처음 튜토리얼' /tmp/pc-lab.html
          grep -q '만든이: 도구리' /tmp/pc-lab.html

      - name: Apply v2.3.16 black-screen hotfix
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch-pages-v2316.py /tmp/pc-lab.html
          echo 'f993991f3edb2e8b565ae0455d08f7f2ec4959e0e9b4bb4b5afe9d6a4ddb84fd  /tmp/pc-lab.html' | sha256sum -c -
          grep -q 'PC LAB v2.3.16' /tmp/pc-lab.html
          grep -q '2.3.16-d5ebb8108e4e' /tmp/pc-lab.html
          grep -q '시작 튜토리얼 배포 검정 화면 긴급 수정' /tmp/pc-lab.html
          grep -q 'const ONBOARDING_KEY' /tmp/pc-lab.html
          grep -q 'PC LAB 처음 튜토리얼' /tmp/pc-lab.html
          grep -q '만든이: 도구리' /tmp/pc-lab.html
          rm -rf _site
          mkdir -p _site
          cp /tmp/pc-lab.html _site/index.html
          printf 'PC LAB v2.3.16\nBuild 2.3.16-d5ebb8108e4e\n만든이: 도구리\n' > _site/version.txt
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
