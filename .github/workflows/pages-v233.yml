name: Deploy PC LAB v2.3.3 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch current verified v2.3.2 Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 'https://doguri25.github.io/pc-lab/?pc_lab_base=v232' -o /tmp/pc-lab.html
          grep -q 'PC LAB v2.3.2' /tmp/pc-lab.html
          grep -q '2.3.2-b622600c7980' /tmp/pc-lab.html

      - name: Apply v2.3.3 patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch-pages-v233.py /tmp/pc-lab.html
          grep -q 'PC LAB v2.3.3' /tmp/pc-lab.html
          grep -q '2.3.3-2b16f203e5d9' /tmp/pc-lab.html
          grep -q 'panelCamera' /tmp/pc-lab.html
          grep -q 'repeat(auto-fill,minmax(155px,1fr))' /tmp/pc-lab.html
          rm -rf _site
          mkdir -p _site
          cp /tmp/pc-lab.html _site/index.html
          printf 'PC LAB v2.3.3\n' > _site/version.txt
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
