name: Publish verified PC LAB index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-index-from-salvage.yml'

permissions:
  contents: write

env:
  EXPECTED_SHA: 706fb18c30d5055be975825d7659c55f9d79eb699d2dc062a6deb8d9936a2d27

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover available TAR bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          parts = sorted(Path('source-archive').glob('part-*.b64'))
          if not parts:
              raise SystemExit('source archive missing')
          s = ''.join(''.join(p.read_text().split()) for p in parts)
          s = s[:len(s) - len(s) % 4]
          Path('/tmp/source.tar.xz').write_bytes(base64.b64decode(s))
          PY
          set +e
          xz -dc /tmp/source.tar.xz > /tmp/source.tar
          set -e
          test -s /tmp/source.tar
          rm -rf /tmp/recovered
          mkdir -p /tmp/recovered
          set +e
          tar -xf /tmp/source.tar -C /tmp/recovered
          set -e

      - name: Find exact build or rebuild
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/verified.html
          rm -f "$OUT"
          GAME="$(find /tmp/recovered -type f -name 'PC_LAB_v2.3.0.html' -print -quit || true)"
          if [ -n "$GAME" ]; then
            GOT="$(sha256sum "$GAME" | awk '{print $1}')"
            if [ "$GOT" = "$EXPECTED_SHA" ]; then
              cp "$GAME" "$OUT"
            fi
          fi

          if [ ! -f "$OUT" ]; then
            BUILD="$(find /tmp/recovered -type f -name build.cjs -print -quit || true)"
            test -n "$BUILD"
            ROOT="$(dirname "$BUILD")"
            cd "$ROOT"
            node build.cjs
            GAME="$(find . -maxdepth 3 -type f -name 'PC_LAB_v2.3.0.html' -print -quit || true)"
            test -n "$GAME"
            GOT="$(sha256sum "$GAME" | awk '{print $1}')"
            test "$GOT" = "$EXPECTED_SHA"
            cp "$GAME" "$OUT"
          fi

          echo "$EXPECTED_SHA  $OUT" | sha256sum -c -
          grep -qi '<!doctype html>' "$OUT"

      - name: Commit exact standalone as root index
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/verified.html index.html
          printf 'PC LAB v2.3.0 root index verified\nSHA256 %s\n' "$EXPECTED_SHA" > PAGES_V230_VERIFIED.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html PAGES_V230_VERIFIED.txt
          if ! git diff --cached --quiet; then
            git commit -m 'fix: publish verified PC LAB v2.3.0 as Pages index'
            git push origin HEAD:main
          fi
