name: Deploy PC LAB to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify standalone PC LAB v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          test -d pages-archive

          # part-15 was damaged during the original connector upload.
          # Its four verified 3 KB fragments are intact and reconstruct the
          # canonical 12 KB part exactly.
          cat pages-archive/part-15a0.b64 pages-archive/part-15a1.b64 pages-archive/part-15a2.b64 pages-archive/part-15a3.b64 > /tmp/part-15.b64
          test "$(wc -c < /tmp/part-15.b64)" -eq 12000
          test "$(git hash-object /tmp/part-15.b64)" = "c183c947f7f04d86cc742ebdd4fc9cebae0c1011"

          : > /tmp/pc-lab-pages.b64
          for n in $(seq -w 0 14); do
            f="pages-archive/part-${n}.b64"
            test -f "$f"
            cat "$f" >> /tmp/pc-lab-pages.b64
          done
          cat /tmp/part-15.b64 >> /tmp/pc-lab-pages.b64
          for n in $(seq -w 16 20); do
            f="pages-archive/part-${n}.b64"
            test -f "$f"
            cat "$f" >> /tmp/pc-lab-pages.b64
          done
          tr -d '\r\n\t ' < /tmp/pc-lab-pages.b64 > /tmp/pc-lab-pages.clean.b64
          mv /tmp/pc-lab-pages.clean.b64 /tmp/pc-lab-pages.b64

          chars=$(wc -c < /tmp/pc-lab-pages.b64)
          echo "Base64 chars: $chars"
          test "$chars" -eq 243136
          echo "026ac6f228345ef8e26b70ddbd307980568e3f115fd93d75009838fbbd3e9696  /tmp/pc-lab-pages.b64" | sha256sum -c -

          base64 --decode /tmp/pc-lab-pages.b64 > /tmp/pc-lab-pages.xz
          echo "a761d59037e27c11426c1fa2ac6afe0537a9991d1e64295a255f49a9471e5660  /tmp/pc-lab-pages.xz" | sha256sum -c -
          xz --test /tmp/pc-lab-pages.xz
          xz --decompress --stdout /tmp/pc-lab-pages.xz > /tmp/pc-lab-pages.html

          bytes=$(wc -c < /tmp/pc-lab-pages.html)
          echo "HTML bytes: $bytes"
          test "$bytes" -eq 755018
          echo "706fb18c30d5055be975825d7659c55f9d79eb699d2dc062a6deb8d9936a2d27  /tmp/pc-lab-pages.html" | sha256sum -c -
          grep -q 'PC LAB' /tmp/pc-lab-pages.html
          grep -q 'v2.3.0' /tmp/pc-lab-pages.html

          rm -rf _site
          mkdir -p _site
          cp /tmp/pc-lab-pages.html _site/index.html
          printf 'PC LAB v2.3.0\n' > _site/version.txt
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
